{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div style="max-width:400px;margin:60px auto">
<h1 style="text-align:center">Login</h1>
{% if error %}<div style="color:var(--red);background:rgba(255,107,129,.1);border:1px solid rgba(255,107,129,.3);border-radius:8px;padding:12px;margin:16px 0;font-size:13px">{{ error }}</div>{% endif %}
<form method="POST" style="margin-top:24px">
  <div style="margin-bottom:16px">
    <label style="display:block;font-size:12px;color:var(--faint);margin-bottom:6px">Username</label>
    <input name="username" type="text" required autofocus style="width:100%;padding:10px 14px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;color:var(--txt);font-size:14px;outline:none">
  </div>
  <div style="margin-bottom:20px">
    <label style="display:block;font-size:12px;color:var(--faint);margin-bottom:6px">Password</label>
    <input name="password" type="password" required style="width:100%;padding:10px 14px;background:var(--bg2);border:1px solid var(--line);border-radius:8px;color:var(--txt);font-size:14px;outline:none">
  </div>
  <button type="submit" style="width:100%;padding:12px;background:var(--green);color:#000;border:none;border-radius:8px;font-size:14px;font-weight:bold;cursor:pointer">Login</button>
</form>
<p style="text-align:center;margin-top:20px;font-size:13px;color:var(--dim)">
  Don't have an account? <a href="/register">Register</a>
</p>
</div>
{% endblock %}
